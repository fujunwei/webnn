<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segment Anything - LiteRT.js + WebNN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 16px;
    }
    .badge-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-gpu { background: #1b5e20; color: #81c784; }
    .badge-webnn { background: #0d47a1; color: #90caf9; }
    .badge-litert { background: #e65100; color: #ffcc80; }
    .badge-error { background: #b71c1c; color: #ef9a9a; }
    .status { font-size: 0.8rem; color: #aaa; }
    .main-container {
      position: relative;
      max-width: 100%;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      background: #16213e;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }
    .progress-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(22, 33, 62, 0.95);
      z-index: 10;
    }
    .progress-overlay.hidden { display: none; }
    .progress-bar {
      width: 260px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }
    .progress-text { font-size: 0.85rem; color: #ccc; }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #5a6fd6; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-secondary:hover:not(:disabled) { background: #444; }
    .btn-danger { background: #c62828; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b71c1c; }
    .file-input-label {
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      background: #333;
      color: #ccc;
      transition: all 0.2s;
    }
    .file-input-label:hover { background: #444; }
    input[type="file"] { display: none; }
    .info-row {
      display: flex;
      gap: 20px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #888;
    }
    .info-row span { font-family: 'SF Mono', 'Consolas', monospace; }
    .log-area {
      margin-top: 16px;
      width: 100%;
      max-width: 680px;
      background: #111;
      border-radius: 8px;
      padding: 12px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 0.75rem;
      color: #aaa;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Segment Anything — LiteRT.js + WebNN</h1>
  <p class="subtitle">MobileSAM TFLite model accelerated via WebNN GPU delegate</p>

  <div class="badge-row">
    <span id="gpu-badge" class="badge badge-gpu">GPU</span>
    <span id="webnn-badge" class="badge badge-webnn">WebNN</span>
    <span class="badge badge-litert">LiteRT.js</span>
    <span id="status-text" class="status">Initializing...</span>
  </div>

  <div class="main-container" id="main-container">
    <canvas id="canvas"></canvas>
    <div id="progress-overlay" class="progress-overlay">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="progress-text">Loading models...</div>
    </div>
  </div>

  <div class="controls">
    <label class="file-input-label" for="file-input">📁 Open Image</label>
    <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.bmp,.gif,.tif,.tiff,.webp">
    <button id="btn-clear" class="btn-secondary" disabled>✕ Clear Points</button>
    <button id="btn-cut" class="btn-primary" disabled>✂ Cut Out</button>
  </div>

  <div class="info-row">
    <span>Encoder: <strong id="enc-time">--</strong></span>
    <span>Decoder: <strong id="dec-time">--</strong></span>
    <span>Backend: <strong id="backend-info">--</strong></span>
  </div>

  <div id="log-area" class="log-area"></div>

  <script type="importmap">
  {
    "imports": {
      "@litertjs/core": "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/dist/index.js",
      "@litertjs/wasm-utils": "https://cdn.jsdelivr.net/npm/@litertjs/wasm-utils@2.5.3/dist/index.js"
    }
  }
  </script>
  <script type="module" src="./index.js"></script>
</body>
</html>
